<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sona101 - Deposit Bonus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            text-decoration: none;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a1f14;
            background-image: radial-gradient(circle at 50% 0%, #164d2e 0%, #0a1f14 70%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: linear-gradient(160deg, #0f2b1a, #0a1f14);
            border: 1px solid #1e4d2b;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            position: relative;
        }

        /* Banner Section */
        .banner {
            width: 100%;
            aspect-ratio: 16/9;
            background-image: url('https://images.12313214.com/mcs-images/announcement/sona101f3/1726138909753_sona101-640x300.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        .banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(to bottom, transparent, #0f2b1a);
        }

        /* Header Text */
        .header-text {
            text-align: center;
            padding: 10px 20px 0 20px;
        }
        .header-text h1 {
            color: #f0c040;
            font-size: 32px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(240, 192, 64, 0.3);
        }
        .highlight-text {
            background: linear-gradient(90deg, rgba(0, 230, 118, 0.1), rgba(0, 230, 118, 0.2), rgba(0, 230, 118, 0.1));
            color: #00e676;
            border: 1px solid rgba(0, 230, 118, 0.4);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.1);
        }

        /* Form Section */
        .form-section {
            padding: 30px;
        }
        
        /* Premium Input Group */
        .input-group {
            position: relative;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }
        .input-group:focus-within {
            border-color: #00e676;
            background: rgba(0, 230, 118, 0.05);
            box-shadow: 0 0 0 4px rgba(0, 230, 118, 0.1);
        }
        .input-group i {
            padding: 0 15px 0 18px;
            color: #5a8062;
            font-size: 18px;
            transition: all 0.3s ease;
        }
        .input-group:focus-within i {
            color: #00e676;
            transform: scale(1.1);
        }
        input {
            width: 100%;
            padding: 18px 18px 18px 0;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input::placeholder { color: #5a8062; }

        /* Premium Login Button */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00e676, #00b248);
            color: #003d1a;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.25);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 230, 118, 0.4);
            filter: brightness(1.1);
        }
        .btn-login:disabled {
            background: #2a5c3b;
            color: #a0c4a8;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            filter: none;
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 230, 118, 0.2);
            border-radius: 50%;
            border-top-color: #00e676;
            animation: spin 1s ease-in-out infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Dashboard Common Styles */
        .dashboard {
            display: none;
            padding: 30px;
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Bonus Page Specific */
        .bonus-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .bonus-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #f0c040, #e6a800);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
            color: #0a1f14;
            box-shadow: 0 5px 15px rgba(240, 192, 64, 0.4);
        }
        .bonus-title { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 5px;}
        .bonus-subtitle { font-size: 14px; color: #8fbc9f; }

        .bonus-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        .bonus-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .bonus-card:hover {
            border-color: #00e676;
            background: rgba(0, 230, 118, 0.05);
        }
        .bonus-card.active {
            border-color: #00e676;
            background: rgba(0, 230, 118, 0.1);
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.2);
        }
        .bonus-card i.icon-left {
            font-size: 24px;
            color: #f0c040;
            background: rgba(240, 192, 64, 0.1);
            padding: 15px;
            border-radius: 12px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bonus-text {
            display: flex;
            flex-direction: column;
        }
        .bonus-text span {
            color: #8fbc9f;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .bonus-text strong {
            font-size: 22px;
            color: #fff;
        }
        .bonus-card .check-icon {
            margin-left: auto;
            color: #00e676;
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .bonus-card.active .check-icon {
            opacity: 1;
        }

        /* Payment Dashboard Specific */
        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2a5c3b;
        }
        .profile-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #00e676, #00b248);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
            color: #003d1a;
            box-shadow: 0 5px 15px rgba(0, 230, 118, 0.4);
        }
        .dashboard-title { 
            font-size: 22px; 
            font-weight: bold; 
            color: #fff; 
            line-height: 1.4;
        }

        .payment-section { text-align: center; }
        .payment-title { font-size: 16px; color: #a0c4a8; margin-bottom: 15px; font-weight: 600; }
        .payment-options { display: flex; gap: 15px; }
        .payment-btn {
            flex: 1;
            padding: 15px 10px;
            color: white;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }
        .payment-btn i { font-size: 24px; }
        .bkash { background: linear-gradient(135deg, #e2136e, #b80b54); box-shadow: 0 4px 10px rgba(225, 19, 110, 0.3); }
        .nagad { background: linear-gradient(135deg, #ee7203, #c25e00); box-shadow: 0 4px 10px rgba(238, 114, 3, 0.3); }
        .payment-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }

        .logout-btn {
            width: 100%;
            margin-top: 30px;
            padding: 12px;
            background: transparent;
            color: #ff5252;
            border: 1px solid rgba(255, 82, 82, 0.5);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .logout-btn:hover { background: rgba(255, 82, 82, 0.1); border-color: #ff5252; }

    </style>
</head>
<body>

<div class="container">
    
    <!-- State 1: Login Page -->
    <div id="loginPage">
        <!-- Top Banner Image -->
        <div class="banner"></div>

        <!-- Header Text -->
        <div class="header-text">
            <h1>Sona101</h1>
            <div class="highlight-text">Deposit & Bonus Claim</div>
        </div>

        <!-- Login Form -->
        <div class="form-section">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="ইউজারনেম লিখুন">
            </div>

            <button class="btn-login" id="loginBtn" onclick="handleLogin()">
                <span>Login</span> <i class="fas fa-sign-in-alt"></i>
            </button>
            
            <!-- Spinner -->
            <div class="spinner" id="spinner"></div>
        </div>
    </div>

    <!-- State 2: Bonus Selection Page -->
    <div id="bonusPage" class="dashboard">
        <div class="bonus-header">
            <div class="bonus-icon">
                <i class="fas fa-gift"></i>
            </div>
            <div class="bonus-title">বোনাস অপশন</div>
            <div class="bonus-subtitle">আপনার পছন্দের অফারটি সিলেক্ট করুন</div>
        </div>

        <div class="bonus-options">
            <!-- Bonus Option 1 -->
            <div class="bonus-card" id="bonus1" onclick="selectBonus('bonus1')">
                <i class="fas fa-money-bill-wave icon-left"></i>
                <div class="bonus-text">
                    <span>Deposit</span>
                    <strong>300৳</strong>
                </div>
                <i class="fas fa-check-circle check-icon"></i>
            </div>

            <!-- Bonus Option 2 -->
            <div class="bonus-card" id="bonus2" onclick="selectBonus('bonus2')">
                <i class="fas fa-coins icon-left"></i>
                <div class="bonus-text">
                    <span>Bonus</span>
                    <strong>700৳</strong>
                </div>
                <i class="fas fa-check-circle check-icon"></i>
            </div>
        </div>

        <button class="btn-login" id="proceedBtn" disabled onclick="showPayment()">
            <span>Proceed to Payment</span> <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <!-- State 3: Payment Dashboard Page -->
    <div id="dashboardPage" class="dashboard">
        
        <div class="dashboard-header">
            <div class="profile-icon">
                <i class="fas fa-check"></i>
            </div>
            <div class="dashboard-title">পেমেন্ট সম্পূর্ণ করুন</div>
        </div>

        <!-- Payment Options -->
        <div class="payment-section">
            <div class="payment-title">পেমেন্ট অপশন নির্বাচন করুন</div>
            <div class="payment-options">
                <!-- বিকাশ লিংক আপডেট করা হয়েছে -->
                <a href="https://www.tigerpay16888.com/payments/payment_bengal/bengal/income/5b252017-a5cd-4c9d-a6ad-56f0e4c11712" class="payment-btn bkash">
                    <i class="fas fa-mobile-alt"></i> বিকাশ
                </a>
                <!-- নগদ লিংক আপডেট করা হয়েছে -->
                <a href="https://www.tigerpay16888.com/payments/payment_bengal/bengal/income/5b252017-a5cd-4c9d-a6ad-56f0e4c11712" class="payment-btn nagad">
                    <i class="fas fa-wallet"></i> নগদ
                </a>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>

</div>

<script>
    // ১. লগইন ফাংশন
    function handleLogin() {
        const username = document.getElementById('username').value;
        const loginBtn = document.getElementById('loginBtn');
        const spinner = document.getElementById('spinner');

        if(username.trim() === '') {
            // ইনপুট ফিল্ড শেক করার এনিমেশন
            const inputGroup = document.querySelector('#loginPage .input-group');
            inputGroup.style.animation = 'shake 0.3s';
            setTimeout(() => inputGroup.style.animation = '', 300);
            return;
        }

        // বাটন লুকিয়ে স্পিনার চালু করা হলো
        loginBtn.style.display = 'none';
        spinner.style.display = 'block';

        // ২ সেকেন্ড এনিমেশন দেখানোর পর বোনাস পেইজে যাবে
        setTimeout(function() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('bonusPage').style.display = 'block';
        }, 2000); 
    }

    // ২. বোনাস সিলেক্ট করার ফাংশন
    function selectBonus(bonusId) {
        // আগের সিলেকশন মুছে ফেলা
        document.querySelectorAll('.bonus-card').forEach(card => {
            card.classList.remove('active');
        });
        
        // নতুন সিলেকশন একটিভ করা
        document.getElementById(bonusId).classList.add('active');
        
        // পেমেন্ট বাটন চালু করা
        document.getElementById('proceedBtn').disabled = false;
    }

    // ৩. পেমেন্ট পেইজে যাওয়ার ফাংশন
    function showPayment() {
        document.getElementById('bonusPage').style.display = 'none';
        document.getElementById('dashboardPage').style.display = 'block';
    }

    // ৪. লগআউট ফাংশন
    function logout() {
        // সব রিসেট করে লগইন পেইজে ফিরে যাওয়া
        document.getElementById('loginPage').style.display = 'block';
        document.getElementById('bonusPage').style.display = 'none';
        document.getElementById('dashboardPage').style.display = 'none';
        
        // ইনপুট ও বোনাস ক্লিয়ার করা
        document.getElementById('username').value = '';
        document.querySelectorAll('.bonus-card').forEach(card => card.classList.remove('active'));
        document.getElementById('proceedBtn').disabled = true;
        
        document.getElementById('loginBtn').style.display = 'flex';
        document.getElementById('spinner').style.display = 'none';
    }

    // শেক এনিমেশনের জন্য সিএসএস যুক্ত করা
    const style = document.createElement('style');
    style.innerHTML = `
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(5px); }
            50% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
    `;
    document.head.appendChild(style);
</script>

</body>
</html>
